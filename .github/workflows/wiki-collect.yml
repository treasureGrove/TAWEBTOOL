name: Collect TA Wiki

on:
  workflow_dispatch:
  schedule:
    - cron: "18 2 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect wiki entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/wiki_collect.mjs

      - name: Commit updated wiki data
        run: |
          if git diff --quiet -- data/ta_wiki_entries.json; then
            echo "No wiki data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ta_wiki_entries.json
          git commit -m "自动更新 TA 知识库"
          git push
