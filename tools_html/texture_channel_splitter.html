<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="在线贴图通道分离工具，将RGBA贴图拆分为独立的R/G/B/A单通道图片，支持直方图预览分析。">
    <meta name="keywords" content="通道分离,贴图拆分,RGBA分离,直方图,单通道,解包贴图">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tools.treasuregrove.art/tools_html/texture_channel_splitter.html">

    <meta property="og:title" content="贴图通道分离工具">
    <meta property="og:description" content="在线贴图通道分离工具，将RGBA贴图拆分为独立的R/G/B/A单通道图片，支持直方图预览分析。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/texture_channel_splitter.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="贴图通道分离工具">
    <meta name="twitter:description" content="在线贴图通道分离工具，将RGBA贴图拆分为独立的R/G/B/A单通道图片，支持直方图预览分析。">
    <title>贴图通道分离</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/texture_channel_splitter.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <div id="panel">
        <div class="sp-head">
            <h1>贴图通道分离工具</h1>
            <p>将贴图拆分为 R / G / B / A 四个独立通道，支持灰度或着色输出，附带通道直方图与统计信息。</p>
        </div>

        <div class="sp-layout">
            <!-- Left: Input -->
            <div class="sp-left">
                <section class="sp-section">
                    <h2>输入贴图</h2>
                    <label class="sp-drop-zone" id="spDropZone">
                        <p>拖拽或点击上传图像</p>
                        <small>支持 JPG / PNG / BMP / WEBP / TGA</small>
                    </label>
                    <input type="file" id="spFileInput" accept="image/*" style="display:none">
                    <div class="sp-src-preview"><canvas id="spSrcCanvas"></canvas></div>
                    <div class="sp-info" id="spInfo">等待上传...</div>
                </section>

                <section class="sp-section">
                    <h2>输出设置</h2>
                    <div class="sp-opt-row">
                        <label>输出模式</label>
                        <select id="spGrayMode">
                            <option value="gray" selected>灰度（每通道独立灰度图）</option>
                            <option value="color">着色（保留原始通道颜色）</option>
                        </select>
                    </div>
                    <div class="sp-opt-row">
                        <label>导出格式</label>
                        <select id="spOutFormat">
                            <option value="png" selected>PNG</option>
                            <option value="jpg">JPG</option>
                            <option value="webp">WEBP</option>
                        </select>
                    </div>
                    <button class="sp-btn" id="spSplitBtn" disabled>分离合并</button>
                </section>
            </div>

            <!-- Right: Channel outputs -->
            <div class="sp-right">
                <div style="display:flex;align-items:center;justify-content:space-between">
                    <span style="font-size:14px;font-weight:600;color:var(--text-main)">通道输出</span>
                    <button class="sp-dl-all-btn" id="spDlAllBtn" style="display:none">下载全部通道</button>
                </div>

                <div class="sp-channel-grid">
                    <div class="sp-channel-card">
                        <div class="sp-channel-head">
                            <h3><span class="dot r"></span>R 通道（AO / ORM-R）</h3>
                            <button class="sp-dl-btn" id="spDlBtn_r">下载</button>
                        </div>
                        <canvas id="spCh_r"></canvas>
                        <div class="sp-channel-info" id="spStats_r">—</div>
                        <div class="sp-hist-wrap"><canvas id="spHist_r"></canvas><div class="sp-hist-label">直方图</div></div>
                    </div>

                    <div class="sp-channel-card">
                        <div class="sp-channel-head">
                            <h3><span class="dot g"></span>G 通道（Roughness / ORM-G）</h3>
                            <button class="sp-dl-btn" id="spDlBtn_g">下载</button>
                        </div>
                        <canvas id="spCh_g"></canvas>
                        <div class="sp-channel-info" id="spStats_g">—</div>
                        <div class="sp-hist-wrap"><canvas id="spHist_g"></canvas><div class="sp-hist-label">直方图</div></div>
                    </div>

                    <div class="sp-channel-card">
                        <div class="sp-channel-head">
                            <h3><span class="dot b"></span>B 通道（Metallic / ORM-B）</h3>
                            <button class="sp-dl-btn" id="spDlBtn_b">下载</button>
                        </div>
                        <canvas id="spCh_b"></canvas>
                        <div class="sp-channel-info" id="spStats_b">—</div>
                        <div class="sp-hist-wrap"><canvas id="spHist_b"></canvas><div class="sp-hist-label">直方图</div></div>
                    </div>

                    <div class="sp-channel-card">
                        <div class="sp-channel-head">
                            <h3><span class="dot a"></span>A 通道（Opacity / Emissive）</h3>
                            <button class="sp-dl-btn" id="spDlBtn_a">下载</button>
                        </div>
                        <canvas id="spCh_a"></canvas>
                        <div class="sp-channel-info" id="spStats_a">—</div>
                        <div class="sp-hist-wrap"><canvas id="spHist_a"></canvas><div class="sp-hist-label">直方图</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/texture_channel_splitter.js"></script>
</body>

</html>
