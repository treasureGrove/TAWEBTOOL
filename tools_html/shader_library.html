<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader函数库</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/shader_library.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <div id="panel">
        <div class="sl-head">
            <h1>Shader 函数库</h1>
            <p>TA 常用 HLSL 着色器函数速查，涵盖颜色调整、数学工具、光照计算、UV与位置四大类别。点击卡片右上角按钮一键复制。</p>
        </div>

        <div class="sl-toolbar">
            <div class="sl-search-wrap">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="slSearch" placeholder="搜索函数名或描述...">
            </div>
            <div class="sl-filters">
                <button class="sl-filter active" data-cat="all">全部</button>
                <button class="sl-filter" data-cat="color">颜色调整</button>
                <button class="sl-filter" data-cat="math">数学工具</button>
                <button class="sl-filter" data-cat="lighting">光照计算</button>
                <button class="sl-filter" data-cat="uv">UV与位置</button>
            </div>
            <div class="sl-count"><span id="slCount">0</span> 个函数</div>
        </div>

        <div class="sl-grid" id="slGrid"></div>
    </div>

    <script src="../js/shader_library.js"></script>
</body>

</html>
