<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="图集/精灵表打包工具">
    <meta property="og:description" content="免费在线图集打包工具，将多张图片合并为精灵表（Sprite Sheet），适用于游戏UI和帧动画制作。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/sprite_sheet_packer.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">
    <meta property="og:image" content="https://tools.treasuregrove.art/assets/images/icon/icon.png">
    <meta property="og:image:alt" content="TA工具箱图标">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="图集/精灵表打包工具">
    <meta name="twitter:description" content="免费在线图集打包工具，将多张图片合并为精灵表（Sprite Sheet），适用于游戏UI和帧动画制作。">
    <meta name="twitter:image" content="https://tools.treasuregrove.art/assets/images/icon/icon.png">
    <title>图集打包工具 - TA工具箱</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/sprite_sheet_packer.css">

    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/icon/apple-touch-icon.png">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <div id="panel">
        <div class="ss-head">
            <h1>Sprite Sheet 图集打包工具</h1>
            <p>批量上传精灵图，自动排列打包为图集（Sprite Atlas），导出 PNG/WebP + JSON 元数据。适用于 UI 图集、序列帧动画等场景。</p>
        </div>

        <div class="ss-layout">
            <!-- Left: Input & Settings -->
            <div class="ss-col">
                <section class="ss-section">
                    <h2>精灵图列表 <span id="ssSpriteCount" style="font-size:11px;color:#5e6e75;font-weight:400">0 张</span></h2>
                    <label class="ss-drop-zone" id="ssDropZone">
                        <p>拖拽或点击上传图片</p>
                        <small>支持多选，支持 JPG / PNG / WEBP</small>
                    </label>
                    <input type="file" id="ssFileInput" accept="image/*" multiple style="display:none">
                    <div class="ss-sprite-list" id="ssSpriteList"></div>
                    <button class="ss-btn-secondary" id="ssClearBtn" style="width:100%;margin-top:8px">清空列表</button>
                </section>

                <section class="ss-section">
                    <h2>打包设置</h2>
                    <div class="ss-opt-row">
                        <label>图集尺寸</label>
                        <select id="ssSizeMode">
                            <option value="auto" selected>自动（POT 2的幂次）</option>
                            <option value="512x512">512 × 512</option>
                            <option value="1024x1024">1024 × 1024</option>
                            <option value="2048x2048">2048 × 2048</option>
                            <option value="4096x4096">4096 × 4096</option>
                        </select>
                    </div>
                    <div class="ss-opt-row">
                        <label>间距 (px)</label>
                        <input type="number" id="ssPadding" min="0" max="32" value="2">
                    </div>
                    <div class="ss-opt-row">
                        <label>背景</label>
                        <div class="ss-bg-toggle">
                            <label><input type="radio" name="ssBg" value="transparent" checked> 透明</label>
                            <label><input type="radio" name="ssBg" value="#000000"> 黑色</label>
                            <label><input type="radio" name="ssBg" value="#ffffff"> 白色</label>
                        </div>
                    </div>
                    <div class="ss-opt-row">
                        <label>导出格式</label>
                        <select id="ssOutFormat">
                            <option value="png" selected>PNG</option>
                            <option value="webp">WebP</option>
                        </select>
                    </div>
                    <button class="ss-btn" id="ssPackBtn" disabled>开始打包</button>
                </section>
            </div>

            <!-- Right: Output -->
            <div class="ss-col">
                <section class="ss-section">
                    <h2>图集输出</h2>
                    <div class="ss-output-wrap">
                        <canvas id="ssOutCanvas" width="512" height="512"></canvas>
                    </div>
                    <div class="ss-output-info" id="ssOutInfo">等待打包...</div>
                    <div class="ss-action-row">
                        <button class="ss-btn" id="ssDlSheetBtn" disabled style="width:auto;margin-top:0">下载图集</button>
                        <button class="ss-btn-secondary" id="ssDlJsonBtn" disabled>下载 JSON</button>
                    </div>
                </section>

                <section class="ss-section">
                    <h2>JSON 元数据预览</h2>
                    <div class="ss-json-box" id="ssJsonBox">{ "frames": {} }</div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/sprite_sheet_packer.js"></script>
</body>

</html>
