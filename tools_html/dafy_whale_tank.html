    <script>
        // 没有 WebGL 时移除 iframe：避免无谓地下载并初始化整包 3D 场景，改为给出明确提示。
        (function () {
            function webglSupported() {
                try {
                    var canvas = document.createElement('canvas');
                    return Boolean(window.WebGLRenderingContext && (canvas.getContext('webgl2') || canvas.getContext('webgl')));
                } catch (error) { return false; }
            }
            if (webglSupported()) return;
            var frame = document.querySelector('.dafy-frame');
            if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
            var fallback = document.getElementById('dafyFallback');
            if (fallback) fallback.hidden = false;
        })();
    </script>

    <script>
        // 沉浸模式：窄屏或触屏时，把站点外壳（76px 图标栏 / 搜索框 / 反馈浮钮）让开，
        // 只留顶部返回栏 + 占满剩余空间的游戏面板。桌面端保持原布局。
        // URL 上可用 ?immersive=1 / ?immersive=0 强制开关。
        (function () {
            var root = document.documentElement;
            var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            var narrow = window.matchMedia && window.matchMedia('(max-width: 980px)').matches;
            var force = new URLSearchParams(location.search).get('immersive');
            var on = force === '1' ? true : force === '0' ? false : (coarse || narrow);

            function apply(next) {
                on = !!next;
                root.classList.toggle('dafy-immersive', on);
                var btn = document.getElementById('dafyBarExit');
                if (btn) btn.textContent = on ? '显示工具箱' : '隐藏工具箱';
                return on;
            }
            apply(on);

            var exitBtn = document.getElementById('dafyBarExit');
            if (exitBtn) {
                exitBtn.addEventListener('click', function () { apply(!on); });
            }

            // 游戏 iframe 里的「全屏」按钮通过 postMessage 请求沉浸
            window.addEventListener('message', function (e) {
                if (e.origin !== location.origin) return;
                var d = e.data;
                if (!d || typeof d !== 'object' || d.type !== 'dafy-immersive') return;
                var now = apply(d.on !== false);
                try {
                    e.source.postMessage({ type: 'dafy-immersive-state', on: now }, location.origin);
                } catch (err) {}
            });
        })();
    </script>
