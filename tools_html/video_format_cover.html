<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线视频格式转换工具，支持MP4/WebM/MKV/AVI/MOV等格式互转，可调整编码和分辨率。">
    <meta name="keywords" content="视频转换,格式转码,MP4,WebM,MKV,编码转换,视频格式">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tools.treasuregrove.art/tools_html/video_format_cover.html">

    <meta property="og:title" content="视频格式转换工具">
    <meta property="og:description" content="免费在线视频格式转换工具，支持MP4/WebM/MKV/AVI/MOV等格式互转，可调整编码和分辨率。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/video_format_cover.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="视频格式转换工具">
    <meta name="twitter:description" content="免费在线视频格式转换工具，支持MP4/WebM/MKV/AVI/MOV等格式互转，可调整编码和分辨率。">
    <title>视频格式转换</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/video_format_cover.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search">
        <input type="text" placeholder="搜索">
    </div>
    <div id="panel">
        <div class="vfc-app">
            <header class="vfc-head">
                <h1>视频格式转换</h1>
                <p>纯浏览器本地转换，不上传文件。支持 MP4 / WebM / GIF 互转。</p>
            </header>

            <div class="vfc-layout">
                <!-- Left: source & settings -->
                <div class="vfc-left">
                    <section class="vfc-section">
                        <h3>素材导入</h3>
                        <input id="vfcFile" type="file" accept="video/*,image/gif" hidden>
                        <div class="vfc-dropzone" id="vfcDropzone">
                            <div class="vfc-drop-content">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <span>拖拽视频到此处或点击选择</span>
                                <small>支持 MP4、WebM、GIF 等格式</small>
                            </div>
                            <video id="vfcPreview" controls playsinline class="vfc-preview" hidden></video>
                        </div>
                        <div class="vfc-meta" id="vfcMeta">未选择文件</div>
                    </section>

                    <section class="vfc-section">
                        <h3>输出设置</h3>
                        <div class="vfc-row">
                            <label>输出格式
                                <select id="vfcFormat">
                                    <option value="webm">WebM (VP9)</option>
                                    <option value="webm-vp8">WebM (VP8)</option>
                                    <option value="gif">GIF 动图</option>
                                </select>
                            </label>
                            <label>视频码率 (Mbps)
                                <input id="vfcBitrate" type="number" min="0.5" max="20" step="0.5" value="3">
                            </label>
                        </div>
                        <div class="vfc-row">
                            <label>输出宽度 (px，0=原始)
                                <input id="vfcWidth" type="number" min="0" max="3840" step="2" value="0">
                            </label>
                            <label>帧率 (FPS，0=原始)
                                <input id="vfcFps" type="number" min="0" max="60" step="1" value="0">
                            </label>
                        </div>
                        <div class="vfc-row vfc-time-row">
                            <label>开始时间 (s)
                                <input id="vfcStart" type="number" min="0" step="0.1" value="0">
                            </label>
                            <label>结束时间 (s，0=全部)
                                <input id="vfcEnd" type="number" min="0" step="0.1" value="0">
                            </label>
                        </div>
                    </section>

                    <section class="vfc-section vfc-actions">
                        <button id="vfcConvertBtn" class="btn-primary">开始转换</button>
                        <button id="vfcCancelBtn" class="btn-secondary">取消</button>
                    </section>
                </div>

                <!-- Right: progress & output -->
                <div class="vfc-right">
                    <section class="vfc-section">
                        <h3>转换进度</h3>
                        <div class="vfc-progress-wrap" id="vfcProgressWrap" style="display:none;">
                            <div class="vfc-progress">
                                <div class="vfc-progress-fill" id="vfcProgressFill"></div>
                            </div>
                            <span id="vfcProgressText">0%</span>
                        </div>
                        <pre id="vfcLog" class="vfc-log">等待操作...</pre>
                    </section>

                    <section class="vfc-section" id="vfcResultSection" style="display:none;">
                        <h3>转换结果</h3>
                        <video id="vfcResultVideo" controls playsinline class="vfc-result-preview" hidden></video>
                        <img id="vfcResultGif" class="vfc-result-preview" hidden>
                        <a id="vfcDownload" class="btn-download" hidden>下载文件</a>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/video_format_cover.js"></script>
</body>

</html>
