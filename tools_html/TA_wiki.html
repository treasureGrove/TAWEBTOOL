<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search">
        <input type="text" placeholder="搜索">
    </div>

    <div id="panel" class="wiki-panel">
        <header class="wiki-header">
            <div class="wiki-title">
                <h1>TA 知识库</h1>
                <p>服务器自动采集并整理图形学、Shader、渲染管线、资产规范和性能排查资料，内置基础知识与自动更新条目统一搜索。</p>
            </div>
            <span class="wiki-sync-badge">服务器自动更新</span>
        </header>

        <section class="wiki-stats" id="wikiStats"></section>

        <section class="wiki-topics" id="wikiTopics"></section>

        <div class="wiki-toolbar">
            <input id="wikiSearch" type="search" placeholder="搜索标题、标签、正文，例如：roughness、drawcall、法线" />
            <select id="wikiCategory"></select>
            <select id="wikiSource">
                <option value="all">全部来源</option>
                <option value="builtin">内置知识库</option>
                <option value="generated">自动采集</option>
            </select>
            <span id="resultHint"></span>
        </div>

        <div class="wiki-modes" id="wikiModes">
            <button type="button" class="active" data-mode="all">全部</button>
            <button type="button" data-mode="knowledge">基础知识</button>
            <button type="button" data-mode="article">外部文章</button>
            <button type="button" data-mode="ai">AI整理</button>
        </div>

        <section class="wiki-layout">
            <aside class="wiki-list" id="wikiList"></aside>
            <article class="wiki-content" id="wikiContent">请选择左侧知识条目。</article>
        </section>
    </div>

    <script src="../js/ta_wiki_data.js"></script>
    <script src="../js/ta_wiki.js"></script>
</body>

</html>
