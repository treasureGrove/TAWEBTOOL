<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA知识库</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/TA_wiki.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>

    <div id="panel" class="wiki-panel">
        <header class="wiki-header">
            <div>
                <h1>TA 知识库</h1>
                <p>使用开源 <strong>Fuse.js</strong> + <strong>Marked</strong> 构建可搜索知识库，支持后台持续新增内容。</p>
            </div>
            <a class="admin-link" href="TA_wiki_admin.html">进入后台维护</a>
        </header>

        <div class="wiki-toolbar">
            <input id="wikiSearch" type="search" placeholder="搜索关键词，例如：roughness、后处理、drawcall" />
            <select id="wikiCategory"></select>
            <span id="resultHint"></span>
        </div>

        <section class="wiki-layout">
            <aside class="wiki-list" id="wikiList"></aside>
            <article class="wiki-content" id="wikiContent">请选择左侧知识条目。</article>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="../js/ta_wiki_data.js"></script>
    <script src="../js/ta_wiki.js"></script>

</body>

</html>
