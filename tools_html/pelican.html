        <div class="pelican-fallback" id="pelicanFallback" hidden>
            <h1>鹈鹕骑行暂不可用</h1>
            <p>当前浏览器没有可用的 WebGL，无法运行这个程序化 3D 场景。请换用支持 WebGL 的浏览器（桌面 Chrome / Edge / Firefox / Safari 均可），或回到工具箱选择其它工具。</p>

    </div>

    <script>
        // 没有 WebGL 时移除 iframe：避免无谓地下载并初始化整包 3D 场景，改为给出明确提示。
        (function () {
            function webglSupported() {
                try {
                    var canvas = document.createElement('canvas');
                    return Boolean(window.WebGLRenderingContext && (canvas.getContext('webgl2') || canvas.getContext('webgl')));
                } catch (error) { return false; }
            }
            if (webglSupported()) return;
            var frame = document.querySelector('.pelican-frame');
            if (frame && frame.parentNode) frame.parentNode.removeChild(frame);
            var fallback = document.getElementById('pelicanFallback');
            if (fallback) fallback.hidden = false;
        })();
    </script>
