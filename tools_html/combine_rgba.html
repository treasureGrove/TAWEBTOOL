<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="在线贴图通道合成工具，将R/G/B/A单通道图片合并为一张RGBA贴图，支持ORM（遮挡/粗糙度/金属度）打包。">
    <meta name="keywords" content="RGBA,通道合成,贴图合成,ORM,合并通道,贴图打包,游戏贴图,TA工具箱,技术美术工具箱,技术美术工具,TA工具,在线TA工具">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tools.treasuregrove.art/tools_html/combine_rgba.html">

    <meta property="og:title" content="贴图通道合成工具">
    <meta property="og:description" content="在线贴图通道合成工具，将R/G/B/A单通道图片合并为一张RGBA贴图，支持ORM（遮挡/粗糙度/金属度）打包。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/combine_rgba.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="贴图通道合成工具">
    <meta name="twitter:description" content="在线贴图通道合成工具，将R/G/B/A单通道图片合并为一张RGBA贴图，支持ORM（遮挡/粗糙度/金属度）打包。">
    <title>贴图通道合成 - TA工具箱</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/combine_rgb.css">

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/icon/apple-touch-icon.png">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>

    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <div id="panel">
        <div class="combine-head">
            <h1>ORM / RGBA 贴图通道合成</h1>
            <p>拖拽上传即显示通道预览，节省空间。支持分辨率、Tiling、Wrap、格式与质量导出。</p>
        </div>

        <div class="combine-layout">
            <section class="left-pane">
                <div class="control-grid3">
                    <label>分辨率预设<select id="rgbaPreset"><option value="512">512 x 512</option><option value="1024" selected>1024 x 1024</option><option value="2048">2048 x 2048</option><option value="4096">4096 x 4096</option><option value="custom">自定义</option></select></label>
                    <label>边长（正方形）<input type="number" id="outSize" min="1" max="8192" value="1024"></label>
                    <label>像素比例<span class="square-tag">1 : 1（固定）</span></label>
                </div>

                <div class="channel-controls">
                    <article class="channel-card">
                        <h3>R（AO）</h3>
                        <div class="card-body"><label class="dropzone" for="rImg" id="rDrop"><span>拖拽或点击上传 R</span></label><input type="file" id="rImg" accept="image/*">
                        <div class="card-opts">
                            <label class="source-ch-label">取源通道<select id="rSrcCh"><option value="lum" selected>亮度</option><option value="0">R</option><option value="1">G</option><option value="2">B</option><option value="3">A</option></select></label>
                            <div class="tile-row"><span>Tile X</span><input id="rTileX" type="range" min="-10" max="10" step="0.01" value="1"><input id="rTileXNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <div class="tile-row"><span>Tile Y</span><input id="rTileY" type="range" min="-10" max="10" step="0.01" value="1"><input id="rTileYNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <select id="rWrap"><option value="repeat">Repeat</option><option value="mirror">Mirror</option><option value="clamp">Clamp</option></select>
                        </div></div>
                    </article>
                    <article class="channel-card">
                        <h3>G（Roughness）</h3>
                        <div class="card-body"><label class="dropzone" for="gImg" id="gDrop"><span>拖拽或点击上传 G</span></label><input type="file" id="gImg" accept="image/*">
                        <div class="card-opts">
                            <label class="source-ch-label">取源通道<select id="gSrcCh"><option value="lum" selected>亮度</option><option value="0">R</option><option value="1">G</option><option value="2">B</option><option value="3">A</option></select></label>
                            <div class="tile-row"><span>Tile X</span><input id="gTileX" type="range" min="-10" max="10" step="0.01" value="1"><input id="gTileXNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <div class="tile-row"><span>Tile Y</span><input id="gTileY" type="range" min="-10" max="10" step="0.01" value="1"><input id="gTileYNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <select id="gWrap"><option value="repeat">Repeat</option><option value="mirror">Mirror</option><option value="clamp">Clamp</option></select>
                        </div></div>
                    </article>
                    <article class="channel-card">
                        <h3>B（Metallic）</h3>
                        <div class="card-body"><label class="dropzone" for="bImg" id="bDrop"><span>拖拽或点击上传 B</span></label><input type="file" id="bImg" accept="image/*">
                        <div class="card-opts">
                            <label class="source-ch-label">取源通道<select id="bSrcCh"><option value="lum" selected>亮度</option><option value="0">R</option><option value="1">G</option><option value="2">B</option><option value="3">A</option></select></label>
                            <div class="tile-row"><span>Tile X</span><input id="bTileX" type="range" min="-10" max="10" step="0.01" value="1"><input id="bTileXNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <div class="tile-row"><span>Tile Y</span><input id="bTileY" type="range" min="-10" max="10" step="0.01" value="1"><input id="bTileYNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <select id="bWrap"><option value="repeat">Repeat</option><option value="mirror">Mirror</option><option value="clamp">Clamp</option></select>
                        </div></div>
                    </article>
                    <article class="channel-card">
                        <h3>A（可选）</h3>
                        <div class="card-body"><label class="dropzone" for="aImg" id="aDrop"><span>拖拽或点击上传 A</span></label><input type="file" id="aImg" accept="image/*">
                        <div class="card-opts">
                            <label class="source-ch-label">取源通道<select id="aSrcCh"><option value="3" selected>A</option><option value="lum">亮度</option><option value="0">R</option><option value="1">G</option><option value="2">B</option></select></label>
                            <div class="tile-row"><span>Tile X</span><input id="aTileX" type="range" min="-10" max="10" step="0.01" value="1"><input id="aTileXNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <div class="tile-row"><span>Tile Y</span><input id="aTileY" type="range" min="-10" max="10" step="0.01" value="1"><input id="aTileYNum" type="number" min="-10" max="10" step="0.01" value="1"></div>
                            <select id="aWrap"><option value="repeat">Repeat</option><option value="mirror">Mirror</option><option value="clamp">Clamp</option></select>
                        </div></div>
                    </article>
                </div>

                <div class="control-grid3 compact">
                    <label>导出格式<select id="rgbaFormat"><option value="tga" selected>TGA</option><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WEBP</option><option value="dds">DDS</option></select></label>
                    <label>质量<input id="rgbaQuality" type="range" min="0.1" max="1" step="0.05" value="1"></label>
                    <label>质量值<input id="rgbaQualityNumber" type="number" min="0.1" max="1" step="0.05" value="1"></label>
                </div>

                <div class="action-row"><button id="mergeRGBA" type="button">合成并下载</button><span id="rgbaStatus">等待上传贴图...</span></div>
            </section>

            <section class="right-pane">
                <div class="pv pv-out">
                    <b>输出预览</b>
                    <canvas id="rgbaCanvas" width="1024" height="1024"></canvas>
                    <div class="alpha-mult-row">
                        <span>Alpha Multiplier</span>
                        <input id="alphaMult" type="range" min="0" max="1" step="0.01" value="1">
                        <input id="alphaMultNum" type="number" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../third_part/tga-encoder.js"></script>
    <script src="../third_part/dds-encoder.js"></script>
    <script src="../js/combine_rgba.js" defer></script>

</body>

</html>
