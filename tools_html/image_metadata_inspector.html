<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="在线图片元数据查看工具，查看贴图分辨率、显存占用、POT检测、直方图和DPI等详细信息。">
    <meta name="keywords" content="贴图信息,显存,VRAM,POT,直方图,分辨率,DPI,纹理信息,TA工具箱,技术美术工具箱,技术美术工具,TA工具,在线TA工具">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tools.treasuregrove.art/tools_html/image_metadata_inspector.html">

    <meta property="og:title" content="贴图信息查看器">
    <meta property="og:description" content="在线图片元数据查看工具，查看贴图分辨率、显存占用、POT检测、直方图和DPI等详细信息。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/image_metadata_inspector.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="贴图信息查看器">
    <meta name="twitter:description" content="在线图片元数据查看工具，查看贴图分辨率、显存占用、POT检测、直方图和DPI等详细信息。">
    <title>贴图信息查看器 - TA工具箱</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/image_metadata_inspector.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <div id="panel">
        <div class="mi-head">
            <h1>贴图信息查看器</h1>
            <p>快速查看贴图元数据：尺寸、POT/NPOT、宽高比、通道信息、显存占用估算、直方图分析、像素取色。</p>
        </div>

        <div class="mi-layout">
            <!-- Left: Input & Preview -->
            <div class="mi-col">
                <section class="mi-section">
                    <h2>输入贴图</h2>
                    <label class="mi-drop-zone" id="miDropZone">
                        <p>拖拽或点击上传图像</p>
                        <small>支持 JPG / PNG / BMP / WEBP / GIF</small>
                    </label>
                    <input type="file" id="miFileInput" accept="image/*" style="display:none">
                </section>

                <section class="mi-section">
                    <h2>预览（鼠标取色）</h2>
                    <div class="mi-preview-wrap">
                        <canvas id="miPreviewCanvas" width="256" height="256"></canvas>
                    </div>
                    <div class="mi-color-info">
                        <div class="mi-color-swatch" id="miColorSwatch" style="background:#000"></div>
                        <div class="mi-color-values" id="miColorValues">移动鼠标到图像上拾取颜色</div>
                    </div>
                </section>
            </div>

            <!-- Right: Info -->
            <div class="mi-col">
                <section class="mi-section">
                    <h2>基本信息</h2>
                    <div class="mi-info-grid" id="miInfoGrid">
                        <div class="mi-info-item full">
                            <div class="label">提示</div>
                            <div class="value" style="font-size:13px">请上传图像以查看详细信息</div>
                        </div>
                    </div>
                    <div style="margin-top:10px">
                        <div class="label" style="font-size:11px;color:var(--text-sub);margin-bottom:4px">常见宽高比</div>
                        <div class="mi-ratio-list" id="miRatioList"></div>
                    </div>
                </section>

                <section class="mi-section">
                    <h2>显存占用估算（VRAM）</h2>
                    <div class="mi-info-grid" id="miMemoryGrid">
                        <div class="mi-info-item full">
                            <div class="label">提示</div>
                            <div class="value" style="font-size:13px">请上传图像以查看显存占用</div>
                        </div>
                    </div>
                </section>

                <section class="mi-section">
                    <h2>直方图分析</h2>
                    <div class="mi-histogram-wrap">
                        <canvas id="miHistCanvas"></canvas>
                        <div class="mi-hist-legend">
                            <span><span class="dot" style="background:#ef4444"></span>R</span>
                            <span><span class="dot" style="background:#22c55e"></span>G</span>
                            <span><span class="dot" style="background:#3b82f6"></span>B</span>
                            <span><span class="dot" style="background:#e2e8f0"></span>Luminance</span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="../js/image_metadata_inspector.js"></script>
</body>

</html>
