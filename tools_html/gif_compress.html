<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="免费在线GIF动图压缩工具，减小GIF文件体积，支持调整帧率、尺寸和质量，适合表情包和动画优化。">
    <meta name="keywords" content="GIF压缩,动图压缩,GIF缩小,动画优化,表情包,帧率调整,TA工具箱,技术美术工具箱,技术美术工具,TA工具,在线TA工具">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://tools.treasuregrove.art/tools_html/gif_compress.html">

    <meta property="og:title" content="GIF压缩器">
    <meta property="og:description" content="免费在线GIF动图压缩工具，减小GIF文件体积，支持调整帧率、尺寸和质量，适合表情包和动画优化。">
    <meta property="og:url" content="https://tools.treasuregrove.art/tools_html/gif_compress.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TA工具箱">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GIF压缩器">
    <meta name="twitter:description" content="免费在线GIF动图压缩工具，减小GIF文件体积，支持调整帧率、尺寸和质量，适合表情包和动画优化。">
    <title>GIF压缩器 - TA工具箱</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/gif_compress.css">
</head>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <script src="../js/gif_compress.js" defer></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>
    <div class="top_search">
        <input type="text" placeholder="搜索">
    </div>
    <div id="panel">
        <h1>GIF压缩器</h1>

        <input type="file" id="fileInput" accept="image/gif" hidden>

        <div class="workbench-layout">
            <div class="preview-column">
                <div class="preview-box">
                    <div class="column-title">原始GIF</div>
                    <div class="preview-area" id="originalPreview">
                        <img id="originalImg" style="display:none;">
                        <span class="preview-placeholder">上传GIF后预览</span>
                    </div>
                    <div class="preview-info" id="originalInfo"></div>
                </div>
                <div class="preview-box">
                    <div class="column-title">压缩后</div>
                    <div class="preview-area" id="compressedPreview">
                        <img id="compressedImg" style="display:none;">
                        <span class="preview-placeholder">压缩后预览</span>
                    </div>
                    <div class="preview-info" id="compressedInfo"></div>
                </div>
            </div>

            <div class="control-column">
                <div class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-content">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>拖拽GIF文件到此处或点击选择</p>
                            <p class="sub-text">仅支持 GIF 格式</p>
                        </div>
                    </div>
                </div>

                <div class="settings-panel">
                    <div class="setting-group">
                        <label>缩放比例 <span id="scaleValue">100</span>%</label>
                        <input type="range" id="scale" min="10" max="100" value="100" step="5">
                    </div>

                    <div class="setting-group">
                        <label>颜色数量 <span id="colorValue">256</span></label>
                        <input type="range" id="colors" min="2" max="256" value="256" step="2">
                        <div class="setting-hint">减少颜色数量可大幅降低体积，但可能影响画质</div>
                    </div>

                    <div class="setting-group">
                        <label>抽帧间隔</label>
                        <select id="frameSkip">
                            <option value="1">保留所有帧</option>
                            <option value="2">每2帧保留1帧</option>
                            <option value="3">每3帧保留1帧</option>
                            <option value="4">每4帧保留1帧</option>
                        </select>
                        <div class="setting-hint">跳帧会减小帧数并同时调整帧延时以保持动画时长</div>
                    </div>

                    <div class="setting-group">
                        <label>有损压缩级别 <span id="lossyValue">0</span></label>
                        <input type="range" id="lossy" min="0" max="200" value="0" step="10">
                        <div class="setting-hint">0 = 无损, 数值越大压缩越强但画质越差</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="clearBtn" class="btn-secondary">清空</button>
                    <button id="compressBtn" class="btn-primary" disabled>开始压缩</button>
                    <button id="downloadBtn" class="btn-primary" style="display:none;">下载</button>
                </div>

                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">处理中...</div>
                </div>
            </div>
        </div>
    </div>


</body>

</html>
