<script>

<body>
    <script src="../js/menu.js"></script>
    <script src="../js/waifu.js"></script>
    <div id="main_bg"></div>
    <div class="left_menu"></div>

    <div class="top_search"><input type="text" placeholder="搜索"></div>

    <main id="panel">
        <!-- 动态氛围背景（随歌曲封面变化） -->
        <div class="cm-ambient" id="cmAmbient"></div>

        <div class="cm-layout">

            <!-- 顶部栏 -->
            <header class="cm-header">
                <div class="cm-header-brand">
                    <div class="cm-vinyl" id="vinyl">
                        <div class="cm-vinyl-inner" id="vinylCover"></div>
                    </div>
                    <div class="cm-brand-text">
                        <h1>和我一起听</h1>
                        <p>网易云音乐 · 随时开听</p>
                    </div>
                </div>
                <div class="cm-header-actions">
                    <div class="cm-account" id="cmAccount"></div>
                    <button class="cm-btn" id="copyLinkBtn" title="复制链接邀请好友">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <span>邀请好友</span>
                    </button>
                    <a class="cm-btn cm-btn-ghost" href="https://music.163.com/#/my/m/music/playlist?id=164804185" target="_blank" rel="noopener">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
                        <span>网易云打开</span>
                    </a>
                </div>
            </header>

            <!-- 主体 -->
            <div class="cm-body">

                <!-- 左侧：来源切换 + 搜索 + 歌曲列表 -->
                <section class="cm-panel cm-track-panel">
                    <div class="cm-panel-toolbar">
                        <div class="cm-sources" id="cmSources"></div>
                        <div class="cm-search-wrap">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input id="cmSearch" type="search" placeholder="搜索歌曲 / 歌手..." autocomplete="off">
                        </div>
                        <div class="cm-playlist-select-wrap" id="cmPlaylistSelectWrap" style="display:none">
                            <select id="cmPlaylistSelect" class="cm-select"></select>
                        </div>
                    </div>
                    <div class="cm-track-list" id="cmTrackList">
                        <div class="cm-empty">
                            <div class="cm-empty-spinner"></div>
                            <span>加载中...</span>
                        </div>
                    </div>
                </section>

                <!-- 右侧：大封面 + 播放控制 -->
                <section class="cm-panel cm-player-panel">
                    <div class="cm-cover-stage">
                        <div class="cm-cover-disc" id="cmCoverDisc">
                            <img id="cmCoverImg" src="" alt="专辑封面">
                            <div class="cm-cover-hole"></div>
                        </div>
                    </div>

                    <div class="cm-now">
                        <div class="cm-control-name" id="cmControlName">选择一首歌</div>
                        <div class="cm-control-artist" id="cmControlArtist">开始你的音乐之旅</div>
                    </div>

                    <div class="cm-progress-row">
                        <span class="cm-time" id="cmTimeCur">00:00</span>
                        <div class="cm-range-wrap">
                            <input type="range" id="cmProgress" class="cm-range" min="0" max="100" value="0" step="0.1">
                        </div>
                        <span class="cm-time" id="cmTimeDur">00:00</span>
                    </div>

                    <div class="cm-control-btns">
                        <button class="cm-ctl-btn" id="cmPrevBtn" type="button" title="上一首" aria-label="上一首">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 20-10-8 10-8v16Z"/><path d="M5 19V5"/></svg>
                        </button>
                        <button class="cm-ctl-btn cm-ctl-main" id="cmPlayBtn" type="button" title="播放/暂停" aria-label="播放或暂停">
                            <svg class="cm-ico-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14a1 1 0 0 0 1.52.85l11-7a1 1 0 0 0 0-1.7l-11-7A1 1 0 0 0 8 5z"/></svg>
                            <svg class="cm-ico-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
                        </button>
                        <button class="cm-ctl-btn" id="cmNextBtn" type="button" title="下一首" aria-label="下一首">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></svg>
                        </button>
                    </div>

                    <div class="cm-status" id="cmStatusText">就绪</div>
                </section>
            </div>

        </div>

        <!-- 扫码登录弹窗：保持在播放器 panel 边界内 -->
        <div class="cm-login-overlay" id="cmLoginOverlay">
            <div class="cm-login-modal">
                <button class="cm-login-close" id="cmLoginClose" type="button" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <h3 class="cm-login-title">扫码登录</h3>
                <p class="cm-login-sub">使用网易云音乐 App 扫描二维码</p>
                <div class="cm-qr-box is-loading" id="cmQRBox">
                    <img id="cmQRImg" src="" alt="二维码">
                </div>
                <p class="cm-login-hint" id="cmQRHint">正在生成二维码...</p>
                <button class="cm-qr-refresh" id="cmQRRefresh" type="button" hidden>重新获取二维码</button>
            </div>
        </div>
    </main>

    <script src="../js/cloud_music.js"></script>
</body>

</html>
